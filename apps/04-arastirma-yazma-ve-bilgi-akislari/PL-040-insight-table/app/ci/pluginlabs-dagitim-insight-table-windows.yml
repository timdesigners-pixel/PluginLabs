name: Insight Table Windows sürümü
# PL-040 Insight Table'in kaynağı PluginLabs deposundaki ürün ön geliştirme alanındadır (apps/04-…/PL-040-insight-table/app; ürün deposu henüz yok).
# Bu iş akışı kaynağı SABİT bir PluginLabs commit'inden alır, Windows runner'ında birim testleri + masaüstü duman testini (gerçek Electron penceresi)
# koşar, kurulum (NSIS) ve taşınabilir exe'yi derler, PE başlığı ve boyutu doğrular, SHA256SUMS-windows.txt + BUILD-INFO-windows.txt üretir
# ve bu depoda insight-table-v<sürüm> etiketiyle yayımlar. Paketler imzasızdır.
on:
  push:
    branches: ['claude/insight-table-v*']
    paths: ['.github/workflows/insight-table-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_REPO: timdesigners-pixel/PluginLabs
  SOURCE_SHA: KAYNAK_SHA
  APP_DIR: src/apps/04-arastirma-yazma-ve-bilgi-akislari/PL-040-insight-table/app
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          path: src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - name: Bağımlılıklar
        working-directory: ${{ env.APP_DIR }}
        run: npm ci
      - name: Birim testleri (çekirdek)
        working-directory: ${{ env.APP_DIR }}
        run: npm test
      - name: Masaüstü duman testi (gerçek Electron penceresi; örnek tablolar, gerçek pano HTML'i, yapıştırma, dosyadan içe aktarma, CSV/JSON dışa aktarma ve gidiş-dönüş, taklit Hub ve yerel model)
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          npm install --no-save playwright@1.49.1
          $env:PLAYWRIGHT_MODULE = 'playwright'
          node tests/desktop-smoke.cjs docs/screenshots | Tee-Object -FilePath smoke.txt
          if ($LASTEXITCODE) { throw 'Duman testi başarısız' }
      - name: Derle
        working-directory: ${{ env.APP_DIR }}
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Doğrula ve özetle
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -eq '.exe' -and $_.Name -notmatch 'uninstall' }
          if ($files.Count -ne 2) { throw "2 exe bekleniyordu, bulunan: $($files.Name -join ', ')" }
          New-Item -ItemType Directory -Force release | Out-Null
          foreach ($f in $files) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "$($f.Name) geçerli bir Windows yürütülebilir dosyası değil (MZ başlığı yok)" }
            if ($f.Length -lt 50MB) { throw "$($f.Name) beklenenden küçük: $($f.Length) bayt" }
            Copy-Item $f.FullName release/
          }
          # Duman testinin Windows runner'ında aldığı gerçek pencere görüntüleri (test verisiyle) release'e eklenir.
          Get-ChildItem docs/screenshots -Filter *.png | ForEach-Object { Copy-Item $_.FullName "release/windows-$($_.Name)" }
          $smoke = (Get-Content smoke.txt | Select-String 'DUMAN TESTİ GEÇTİ' | Select-Object -Last 1).Line
          @(
            "Insight Table $ver — Windows derlemesi",
            "kaynak: $env:SOURCE_REPO@$env:SOURCE_SHA (apps/04-arastirma-yazma-ve-bilgi-akislari/PL-040-insight-table/app)",
            "iş akışı commit'i: $env:GITHUB_REPOSITORY@$env:GITHUB_SHA ($env:GITHUB_REF_NAME)",
            "çalıştırma: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "tarih (UTC): $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm'))",
            "runner: $env:ImageOS $env:ImageVersion · node $(node -v) · electron $((Get-Content node_modules/electron/package.json -Raw | ConvertFrom-Json).version)",
            "testler: npm test (çekirdek: HTML tablo/liste/tanım listesi çıkarma, rowspan/colspan, CSV/TSV/Markdown/satırlar, TR/EN sayı ve tarih yerelleştirmesi, tür işaretleri, kişisel veri, CSV formül enjeksiyonu ve gidiş-dönüş, JSON, elle etiketli 84 hücrede doğruluk, MyMind yanıt denetimi) + masaüstü duman testi (gerçek Electron penceresi; izin isteklerinin reddi, örnek tablolarda hücre doğruluğu %100, gerçek panodan HTML tablo, kaynak adresi doğrulaması, CSV formül enjeksiyonu etkisiz + kişisel veri maskeli + diske yazılıp geri okunan gidiş-dönüş farkı 0, Excel (Türkçe) hazır ayarı, kişisel veri sütununu çıkarma, JSON türlü değerler + kaynak izi, sütun adı/tür/dahil etme düzenleme, başlık satırı, .html (script içi sahte tablo ve menü listeleri atlanır) + .csv içe aktarma, desteklenmeyen dosyanın atlanması, kaynak dosyaların değişmediği (SHA-256), taklit MyMind: onay/red, kişisel veri/kaynak adresi gönderilmez, tabloda olmayan sütun/örnek dışı satır/hücre değeri önerilerinin atılması, ad önerisini uygulama; yerel model (loopback), arşiv/geri alma, ölçüler, kalıcılık) bu çalıştırmada geçti",
            "duman testi: $smoke",
            "imza: yok (Authenticode imzasız)"
          ) | Set-Content -Encoding utf8 release/BUILD-INFO-windows.txt
          Push-Location release
          Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS-windows.txt' -and $_.Name -ne 'BUILD-INFO-windows.txt' } | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding utf8 SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt
          Get-Content BUILD-INFO-windows.txt
          Get-ChildItem | Format-Table Name, Length
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: insight-table-windows
          path: ${{ env.APP_DIR }}/release
          if-no-files-found: error
      - name: Yayımla (insight-table-v<sürüm>)
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "insight-table-v$env:VER"
          $assets = (Get-ChildItem release -File).FullName
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $global:LASTEXITCODE = 0
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE) { throw 'Yükleme başarısız' }
            gh release edit $tag --notes-file RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY
          } else {
            $global:LASTEXITCODE = 0
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Insight Table $env:VER (önizleme)" --notes-file RELEASE-NOTES.md
            if ($LASTEXITCODE) { throw 'Release oluşturulamadı' }
          }
