<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Action Inbox — görev kutusu</title>
<link rel="stylesheet" href="pl/pl-tokens.css">
<link rel="stylesheet" href="pl/pl-components.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="widget.css">
</head>
<body>
<div class="axw" id="root" data-pl data-pl-theme="dark" data-pl-product="hub" lang="tr">
  <header class="axw-head">
    <span class="pl-applogo axw-logo" aria-hidden="true">AI</span>
    <div class="axw-head__text"><b>Görev kutusu</b><span class="pl-muted" id="wInfo"></span></div>
    <button class="pl-btn pl-btn--ghost pl-btn--sm" type="button" id="wOpen" title="Ana pencereyi aç">Aç</button>
  </header>
  <ul class="axw-list" id="wList" aria-label="Yaklaşan görevler"></ul>
  <footer class="axw-foot">
    <button class="pl-btn pl-btn--secondary pl-btn--sm" type="button" id="wClip">Panodan yakala</button>
    <span class="pl-badge" id="wReview" title="İnceleme kuyruğu">0 aday</span>
  </footer>
  <div class="ax-toasts axw-toasts" id="toasts" aria-live="polite"></div>
</div>
<script src="src/core.js"></script>
<script src="widget.js"></script>
</body>
</html>
