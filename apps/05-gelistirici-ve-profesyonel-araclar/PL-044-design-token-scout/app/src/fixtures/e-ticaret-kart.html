<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Ürün Listesi</title>
<style>
* { margin: 0; box-sizing: border-box; }
body { background: #f8fafc; color: #0f172a; font: 15px/1.5 "Helvetica Neue", Arial, sans-serif; padding: 20px; }
h1 { font-size: 22px; margin-bottom: 16px; }
.izgara { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.kart { background: #ffffff; border-radius: 16px; padding: 16px; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); display: flex; flex-direction: column; gap: 8px; }
.kart:hover { box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16); }
.gorsel { height: 120px; border-radius: 10px; background: #e2e8f0; }
.kart h2 { font-size: 18px; }
.kart p { font-size: 13px; color: #64748b; }
.fiyat { color: #059669; font-size: 18px; font-weight: 700; }
.rozet { align-self: flex-start; padding: 4px 8px; border-radius: 10px; background: #f59e0b; color: #0f172a; font-size: 13px; }
button { padding: 12px 16px; border: 0; border-radius: 10px; background: #0f766e; color: #ffffff; font: 700 15px "Helvetica Neue", Arial, sans-serif; }
button:hover { background: #115e59; }
.ikinci { background: #10776f; }
</style></head>
<body>
<h1>Mutfak gereçleri</h1>
<div class="izgara">
  <div class="kart"><div class="gorsel"></div><span class="rozet">Yeni</span><h2>Döküm tava</h2><p>28 cm, indüksiyona uygun.</p><span class="fiyat">1.450 ₺</span><button>Sepete ekle</button></div>
  <div class="kart"><div class="gorsel"></div><h2>Şef bıçağı</h2><p>20 cm, paslanmaz çelik.</p><span class="fiyat">980 ₺</span><button>Sepete ekle</button></div>
  <div class="kart"><div class="gorsel"></div><span class="rozet">İndirim</span><h2>Kesme tahtası</h2><p>Zeytin ağacı.</p><span class="fiyat">620 ₺</span><button class="ikinci">Sepete ekle</button></div>
</div>
<script type="application/json" id="dts-beklenen">{"color":["#f8fafc","#0f172a","#ffffff","#64748b","#059669","#f59e0b","#0f766e","#e2e8f0"],"fontSize":["13px","15px","18px","22px"],"space":["8px","16px","20px"],"radius":["10px","16px"],"fontFamily":["Helvetica Neue"],"birlesmeli":[["#0f766e","#10776f"]]}</script>
</body></html>
