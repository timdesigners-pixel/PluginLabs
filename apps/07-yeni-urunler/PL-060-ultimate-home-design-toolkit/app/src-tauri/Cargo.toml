[package]
name = "ultimate-home"
version = "0.1.0"
description = "PluginLabs Ultimate Home Design Toolkit — modüler ev tasarımı, ölçü, maliyet ve render"
authors = ["PluginLabs"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
md-5 = "0.10"
uhd-engine = { path = "../engine" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
