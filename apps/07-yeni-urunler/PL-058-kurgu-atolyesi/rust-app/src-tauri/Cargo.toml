[package]
name = "kurgu-studio"
version = "0.3.0"
description = "PluginLabs Kurgu Atölyesi — Rust kurgu ve kompozisyon stüdyosu"
authors = ["PluginLabs"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = "s"
strip = true
