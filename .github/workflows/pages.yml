name: Web siteleri (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - "sites/**"
      - "scripts/sites-*.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Site varlıklarını denetle
        run: node scripts/sites-sync.cjs --check
      - name: Site testleri
        run: node --test test/sites.test.cjs
      - name: Pages çıktısını oluştur
        run: node scripts/sites-pages.cjs _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
