name: Publish independently built Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v0.2.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-binaries/v0.2.0
          persist-credentials: false
      - name: Verify precompiled files without compiling or executing them
        run: |
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          assert hashlib.sha256(Path('SHA256SUMS.txt').read_bytes()).hexdigest() == 'a178371de0b4055dbe5bae1f95d84057f5bd875ca322adf41ddce2f091038c7b'
          info = json.loads(Path('BUILD-INFO.json').read_text())
          assert info['version'] == '0.2.0'
          assert info['commit'] == 'cac2dfdafb4fe07c5875e5dc824c5d8a24cf3347'
          for file in Path('.').glob('*.exe'):
              data = file.read_bytes()
              offset = struct.unpack_from('<I', data, 0x3c)[0]
              assert data[:2] == b'MZ' and data[offset:offset+4] == b'PE\0\0'
          print('Independently compiled Windows packages verified; no compilation on GitHub.')
          PY
          sha256sum -c SHA256SUMS.txt
          # GitHub normalizes spaces in asset filenames to periods.
          python3 - <<'PYTHON'
          from pathlib import Path
          file = Path('SHA256SUMS.txt')
          rows = [line.split('  ', 1) for line in file.read_text().splitlines()]
          file.write_text(''.join(checksum + '  ' + name.replace(' ', '.') + '\n' for checksum, name in rows))
          PYTHON
      - name: Publish verified existing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual_source=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.0" --jq .object.sha)
          test "$actual_source" = "cac2dfdafb4fe07c5875e5dc824c5d8a24cf3347"
          assets=("PluginLabs Hub Setup 0.2.0.exe" "PluginLabs Hub 0.2.0.exe" PluginLabs-Browser-Bridge-0.2.0.zip PluginLabs-Hub-Source-0.2.0.zip SHA256SUMS.txt BUILD-INFO.json)
          if ! gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.2.0 --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "PluginLabs Hub v0.2.0" --notes-file RELEASE-NOTES.md
          fi
          gh release upload v0.2.0 "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v0.2.0 --repo "$GITHUB_REPOSITORY" --draft=false --latest
