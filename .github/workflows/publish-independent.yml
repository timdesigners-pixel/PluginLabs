name: Publish independently built Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v0.2.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-binaries/v0.2.1
          persist-credentials: false
      - name: Verify precompiled files without compiling or executing them
        run: |
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          assert hashlib.sha256(Path('SHA256SUMS.txt').read_bytes()).hexdigest() == '19ebd83f45aa2e64a23aa58b4c3026787c43188a6323210c02d4877c6df34683'
          info = json.loads(Path('BUILD-INFO.json').read_text())
          assert info['version'] == '0.2.1'
          assert info['commit'] == '38c1fc42a0e4de9af7ec961a60b74560dbe101f6'
          for file in Path('.').glob('*.exe'):
              data = file.read_bytes()
              offset = struct.unpack_from('<I', data, 0x3c)[0]
              assert data[:2] == b'MZ' and data[offset:offset+4] == b'PE\0\0'
          print('Independently compiled Windows packages verified; no compilation on GitHub.')
          PY
          sha256sum -c SHA256SUMS.txt
          # GitHub normalizes spaces in asset filenames to periods.
          python3 - <<'PYTHON'
          from pathlib import Path
          file = Path('SHA256SUMS.txt')
          rows = [line.split('  ', 1) for line in file.read_text().splitlines()]
          file.write_text(''.join(checksum + '  ' + name.replace(' ', '.') + '\n' for checksum, name in rows))
          PYTHON
      - name: Publish verified existing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual_source=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.1" --jq .object.sha)
          test "$actual_source" = "38c1fc42a0e4de9af7ec961a60b74560dbe101f6"
          assets=("PluginLabs Hub Setup 0.2.1.exe" "PluginLabs Hub 0.2.1.exe" PluginLabs-Browser-Bridge-0.2.0.zip PluginLabs-Hub-Source-0.2.1.zip SHA256SUMS.txt BUILD-INFO.json)
          if ! gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.2.1 --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "PluginLabs Hub v0.2.1" --notes-file RELEASE-NOTES.md
          fi
          gh release upload v0.2.1 "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v0.2.1 --repo "$GITHUB_REPOSITORY" --draft=false --latest
