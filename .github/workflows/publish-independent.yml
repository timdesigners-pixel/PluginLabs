name: Publish independently built Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v0.1.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-binaries/v0.1.0
          persist-credentials: false
      - name: Verify precompiled artifacts (no build)
        run: |
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          expected = {
            'PluginLabs Hub 0.1.0.exe': 'a470c44916ea5aaa830ad502422d1d326a8fb2b55f34c621512fdbd54f6391c5',
            'PluginLabs Hub Setup 0.1.0.exe': 'aaefc19ab6c974cd72227c24ebd08e7938b52dc2dead9ab18dd8416fad978a66',
            'PluginLabs-Hub-Source-0.1.0.zip': '5638377f3d500ddcdddb23f08fc896e299f0fb2c4813933f6783a3244cb7e05a',
          }
          info = json.loads(Path('BUILD-INFO.json').read_text())
          assert info['version'] == '0.1.0'
          assert info['commit'] == 'aa9cb77f782045dc72b8f0df3eaa30107bcdbad5'
          for name, checksum in expected.items():
              data = Path(name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == checksum, name
              if name.endswith('.exe'):
                  offset = struct.unpack_from('<I', data, 0x3c)[0]
                  assert data[:2] == b'MZ' and data[offset:offset+4] == b'PE\0\0'
          print('Previously compiled Windows files verified; no compilation on GitHub.')
          PY
          sha256sum -c SHA256SUMS.txt
      - name: Publish existing binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_commit=$(python3 -c "import json; print(json.load(open('BUILD-INFO.json'))['commit'])")
          actual_source=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" --jq .object.sha)
          test "$actual_source" = "$source_commit"
          assets=("PluginLabs Hub Setup 0.1.0.exe" "PluginLabs Hub 0.1.0.exe" "PluginLabs-Hub-Source-0.1.0.zip" SHA256SUMS.txt BUILD-INFO.json)
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.1.0 "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v0.1.0 --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release create v0.1.0 "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "PluginLabs Hub v0.1.0" --notes-file RELEASE-NOTES.md
          fi
