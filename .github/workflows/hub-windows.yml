name: Hub Windows sürümü
# MUST HAVE (MH-2, MH-8): her uygulama sürümü kataloğa girince Hub de yeni sürümle yayınlanır.
# Elle çalışır; Windows runner'ında main'den testleri koşar, kurulum (NSIS) + taşınabilir exe derler,
# PE başlığı/boyutu doğrular, SHA256SUMS.txt ve BUILD-INFO.json üretir. publish=true ise v<sürüm> release'i oluşturur.
# Paketler imzasızdır. Üretilen ikili dosyalar git'e eklenmez.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "true ise release oluşturulur/güncellenir (varsayılan false: yalnız derleme ve doğrulama)"
        required: false
        default: "false"
        type: string
permissions:
  contents: read
concurrency:
  group: hub-windows
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Arayüz testi (gerçek Electron penceresi)
        run: |
          npm install --no-save playwright@1.49.1
          npm run test:ui
        env:
          PLAYWRIGHT_MODULE: playwright
      - name: Derle
        run: npm run build:win
      - name: Doğrula ve özetle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $exes = Get-ChildItem dist -File | Where-Object { $_.Extension -eq '.exe' -and $_.Name -notmatch 'uninstall' }
          if ($exes.Count -ne 2) { throw "2 exe bekleniyordu, bulunan: $($exes.Name -join ', ')" }
          New-Item -ItemType Directory -Force release | Out-Null
          foreach ($f in $exes) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "$($f.Name) geçerli bir Windows yürütülebilir dosyası değil" }
            if ($f.Length -lt 50MB) { throw "$($f.Name) beklenenden küçük: $($f.Length) bayt" }
            Copy-Item $f.FullName release/
          }
          $catalog = node -e "console.log(JSON.stringify(require('./src/catalog.cjs').catalog.filter(c=>c.kind==='app').map(c=>({id:c.id,version:c.version,sha256:c.sha256}))))"
          @{ product = 'PluginLabs Hub'; version = $ver; commit = $env:GITHUB_SHA; builtAt = (Get-Date).ToUniversalTime().ToString('o'); runner = 'windows-latest'; signed = $false; tests = 'npm test + test:ui (Electron, Windows)'; catalogApps = ($catalog | ConvertFrom-Json) } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 release/BUILD-INFO.json
          Push-Location release
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location
      - name: Yayımla
        if: inputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:VER"
          $assets = (Get-ChildItem release -File).FullName
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $global:LASTEXITCODE = 0
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE) { throw 'Yükleme başarısız' }
            gh release edit $tag --notes-file RELEASE-NOTES.md --latest
          } else {
            $global:LASTEXITCODE = 0
            gh release create $tag @assets --target $env:GITHUB_SHA --title "PluginLabs Hub $tag" --notes-file RELEASE-NOTES.md --latest
            if ($LASTEXITCODE) { throw 'Release oluşturulamadı' }
          }
