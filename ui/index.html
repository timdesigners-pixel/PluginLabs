<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>PluginLabs Hub</title>
    <link rel="stylesheet" href="design-tokens.css" />
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="pl/pl-tokens.css" />
    <link rel="stylesheet" href="pl/pl-components.css" />
    <link rel="stylesheet" href="pl/pl-advanced.css" />
    <link rel="stylesheet" href="hub-kasim.css" />
  </head>
  <body>
    <aside>
      <a class="brand" href="#home"
        ><span class="logo">p<span>l</span></span
        ><span>PluginLabs<small>CREATIVE ECOSYSTEM</small></span></a
      >
      <div class="workspace">
        <i class="status-dot"></i>Kişisel çalışma alanı<span>⌄</span>
      </div>
      <nav aria-label="Ana gezinme">
        <button data-page="home" class="active">
          <span>◈</span>Genel bakış</button
        ><button data-page="apps"><span>▦</span>Uygulamalarım</button
        ><button data-page="extensions"><span>◇</span>Eklenti yöneticisi</button
        ><button data-page="ideas"><span>▱</span>Uygulama kataloğu</button
        ><button data-page="discover"><span>⌘</span>Keşfet</button
        ><button data-page="resources"><span>▧</span>Kaynak kütüphanesi</button
        ><button data-page="mymind">
          <span>✳</span>My Mind <b>LOCAL AI</b>
        </button>
        <div class="nav-label">YÖNETİM</div>
        <button data-page="updates">
          <span>↻</span>Güncellemeler <em id="update-count"></em></button
        ><button data-page="activity"><span>◷</span>İşlem geçmişi</button
        ><button data-page="api"><span>⌁</span>API ve izinler</button
        ><button data-page="settings"><span>⚙</span>Ayarlar</button>
      </nav>
      <div class="aside-bottom">
        <div class="local-note">
          <span class="status-dot"></span>Yerel çalışma alanı<small
            >Verileriniz bu cihazda saklanır.</small
          >
        </div>
        <div class="profile">
          <span class="avatar">PL</span>
          <div>PluginLabs Hub<small>Sürüm 0.3.0 · Önizleme</small></div>
        </div>
      </div>
    </aside>
    <main>
      <header>
        <div class="breadcrumbs">
          Çalışma alanı <span>/</span>
          <strong id="breadcrumb">Genel bakış</strong>
        </div>
        <div class="header-right">
          <label class="search"
            ><span>⌕</span
            ><input
              id="search"
              placeholder="Uygulama veya kaynak ara…"
              aria-label="Uygulama veya kaynak ara"
            /><kbd>/</kbd></label
          ><button class="icon-button" data-go="activity" title="İşlem geçmişi">
            ◷</button
          ><span class="avatar small">PL</span>
        </div>
      </header>
      <div id="content" tabindex="-1"></div>
      <footer>
        <span id="footer-status">Yerel merkez hazırlanıyor…</span
        ><span>PluginLabs · Create your own workflow</span>
      </footer>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <dialog id="palette" aria-label="Komut paleti">
      <div data-pl data-pl-theme="dark" data-pl-product="hub" lang="tr">
        <div class="pl-cmdk" role="dialog" aria-label="Komut paleti">
          <div class="pl-cmdk__input">
            <svg class="pl-ico pl-ico--20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="palette-input" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-label="Komut ara" placeholder="Sayfa, uygulama veya eylem ara…" autocomplete="off" />
            <span class="pl-kbd">Esc</span>
          </div>
          <div class="pl-cmdk__list" id="palette-list" role="listbox"></div>
          <div class="pl-cmdk__foot"><span><span class="pl-kbd">↑</span><span class="pl-kbd">↓</span> gezin</span><span><span class="pl-kbd">↵</span> aç</span><span><span class="pl-kbd">Esc</span> kapat</span></div>
        </div>
      </div>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
